services:
  db:
    image: postgres:15-alpine
    container_name: glitr_db
    environment:
      POSTGRES_USER: glitr
      POSTGRES_PASSWORD: glitr
      POSTGRES_DB: glitrdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitr -d glitrdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: glitr_app
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      # Mount results dir so images persist across restarts
      - ./static/results:/app/static/results
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  pgdata:
